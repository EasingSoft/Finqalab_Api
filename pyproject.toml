[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finqalab-api"
version = "0.1.0"
description = "Unofficial Python client for the Finqalab / Next Capital trading API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "EasingSoft" }]
keywords = ["finqalab", "psx", "trading", "stock-market", "pakistan", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "requests>=2.28",
    "pycryptodome>=3.18",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/EasingSoft/Finqalab_Api"
Documentation = "https://github.com/EasingSoft/Finqalab_Api/tree/main/doc"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
